name: Validate labs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-powershell:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan for unsafe artifacts
        shell: pwsh
        run: ./shared/powershell/Test-RepositorySafety.ps1

      - name: Validate Hermes fixtures
        shell: pwsh
        run: |
          ./series/hermes-agent/v0.20.1/labs/01-session-workspace-continuity/scripts/Test-LabFixtures.ps1
          ./series/hermes-agent/v0.20.1/labs/02-context-and-compression/scripts/Test-LabFixtures.ps1
          ./series/hermes-agent/v0.20.1/labs/03-memory-skills-and-approval/scripts/Test-LabFixtures.ps1
          ./series/hermes-agent/v0.20.6/labs/04-execution-contracts/scripts/Test-LabFixtures.ps1

      - name: Smoke-test Part 1 harness
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'hermes-session-lab'
          ./series/hermes-agent/v0.20.1/labs/01-session-workspace-continuity/scripts/Initialize-Lab.ps1 -Destination $target
          ./series/hermes-agent/v0.20.1/labs/01-session-workspace-continuity/scripts/Test-LabFixtures.ps1 -FixtureRoot $target
          python -m py_compile ./series/hermes-agent/v0.20.1/labs/01-session-workspace-continuity/scripts/run-storage-probe.py

      - name: Smoke-test Part 2 harness
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'hermes-context-lab'
          ./series/hermes-agent/v0.20.1/labs/02-context-and-compression/scripts/Initialize-Lab.ps1 -Destination $target
          ./series/hermes-agent/v0.20.1/labs/02-context-and-compression/scripts/Test-LabFixtures.ps1 -FixtureRoot $target
          Set-Content -LiteralPath (Join-Path $target 'evidence/example.txt') -Value 'synthetic evidence'
          ./series/hermes-agent/v0.20.1/labs/02-context-and-compression/scripts/New-SHA256Manifest.ps1 -Root (Join-Path $target 'evidence')
          if (-not (Test-Path -LiteralPath (Join-Path $target 'evidence/SHA256SUMS.txt'))) {
            throw 'PowerShell manifest was not created.'
          }

      - name: Smoke-test Part 3 harness
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'hermes-memory-skills-lab'
          ./series/hermes-agent/v0.20.1/labs/03-memory-skills-and-approval/scripts/Initialize-Lab.ps1 -Destination $target
          ./series/hermes-agent/v0.20.1/labs/03-memory-skills-and-approval/scripts/Test-LabFixtures.ps1 -FixtureRoot $target

      - name: Smoke-test Part 4 harness
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'hermes-execution-contracts-lab'
          ./series/hermes-agent/v0.20.6/labs/04-execution-contracts/scripts/Initialize-Lab.ps1 -Destination $target
          ./series/hermes-agent/v0.20.6/labs/04-execution-contracts/scripts/Test-LabFixtures.ps1 -FixtureRoot $target
          ./series/hermes-agent/v0.20.6/labs/04-execution-contracts/scripts/Run-Controls.ps1 -Workspace $target

  unix-bash:
    name: ${{ matrix.os }} / Bash
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan for unsafe artifacts and broken links
        run: python3 ./shared/python/test_repository_safety.py

      - name: Validate Hermes fixtures
        run: |
          bash ./series/hermes-agent/v0.20.1/labs/01-session-workspace-continuity/scripts/test-lab-fixtures.sh
          bash ./series/hermes-agent/v0.20.1/labs/02-context-and-compression/scripts/test-lab-fixtures.sh
          bash ./series/hermes-agent/v0.20.1/labs/03-memory-skills-and-approval/scripts/test-lab-fixtures.sh
          bash ./series/hermes-agent/v0.20.6/labs/04-execution-contracts/scripts/test-lab-fixtures.sh

      - name: Smoke-test Part 1 harness
        run: |
          target="$RUNNER_TEMP/hermes-session-lab"
          bash ./series/hermes-agent/v0.20.1/labs/01-session-workspace-continuity/scripts/initialize-lab.sh "$target"
          bash ./series/hermes-agent/v0.20.1/labs/01-session-workspace-continuity/scripts/test-lab-fixtures.sh "$target"
          python3 -m py_compile ./series/hermes-agent/v0.20.1/labs/01-session-workspace-continuity/scripts/run-storage-probe.py

      - name: Smoke-test Part 2 harness
        run: |
          target="$RUNNER_TEMP/hermes-context-lab"
          bash ./series/hermes-agent/v0.20.1/labs/02-context-and-compression/scripts/initialize-lab.sh "$target"
          bash ./series/hermes-agent/v0.20.1/labs/02-context-and-compression/scripts/test-lab-fixtures.sh "$target"
          printf 'synthetic evidence\n' > "$target/evidence/example.txt"
          bash ./series/hermes-agent/v0.20.1/labs/02-context-and-compression/scripts/new-sha256-manifest.sh "$target/evidence"
          test -s "$target/evidence/SHA256SUMS.txt"

      - name: Smoke-test Part 3 harness
        run: |
          target="$RUNNER_TEMP/hermes-memory-skills-lab"
          bash ./series/hermes-agent/v0.20.1/labs/03-memory-skills-and-approval/scripts/initialize-lab.sh "$target"
          bash ./series/hermes-agent/v0.20.1/labs/03-memory-skills-and-approval/scripts/test-lab-fixtures.sh "$target"

      - name: Smoke-test Part 4 harness
        run: |
          target="$RUNNER_TEMP/hermes-execution-contracts-lab"
          bash ./series/hermes-agent/v0.20.6/labs/04-execution-contracts/scripts/initialize-lab.sh "$target"
          bash ./series/hermes-agent/v0.20.6/labs/04-execution-contracts/scripts/test-lab-fixtures.sh "$target"
          bash ./series/hermes-agent/v0.20.6/labs/04-execution-contracts/scripts/run-controls.sh "$target"
