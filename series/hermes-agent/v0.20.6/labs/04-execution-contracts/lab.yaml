claims:
  - id: capability-provenance
    expected: tools, plugins, and MCP servers describe different capability and trust boundaries
  - id: direct-owner
    expected: the current session owns direct tool execution
  - id: delegation-owner
    expected: a child receives fresh context and no broader tool authority than its parent
  - id: persistent-goal-owner
    expected: a session continues under a goal contract, gate, judge, and bounded turn budget
  - id: cron-owner
    expected: cron owns the trigger and fresh run while operation and delivery evidence remain separate
  - id: immutable-attempt-evidence
    expected: every attempt has its own receipt and duplicates do not replace primary success evidence
